# VeloxPOS — one-command containerized deployment.
#
# First run (initializes the SQLite volume, then starts the app):
#   AUTH_SECRET="$(openssl rand -hex 32)" docker compose --profile init up
#   (or: docker compose run --rm app bunx prisma db push --schema prisma/schema.prisma)
# Subsequent runs:
#   docker compose up -d
#
# The full walkthrough lives in docs/DEPLOYMENT.md §Docker.

services:
  veloxpos:
    build:
      context: .
    image: veloxpos:latest
    restart: unless-stopped
    ports:
      - "${VELOXPOS_PORT:-3000}:3000"
    environment:
      # REQUIRED in production (DEPLOYMENT.md §3) — generate with
      # `openssl rand -hex 32`. Refuses to boot with the placeholder.
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET before starting (openssl rand -hex 32)}"
      # Canonical public origin for metadata/sitemap (read at serve time).
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # One-shot database initializer: pushes the schema and (optionally) seeds
  # the demo workspace onto the shared volume. Runs only with --profile init.
  init:
    build:
      context: .
    image: veloxpos:latest
    profiles: ["init"]
    environment:
      DATABASE_URL: "file:/data/custom.db"
    volumes:
      - db-data:/data
    command: >
      sh -c "bunx prisma db push --schema prisma/schema.prisma --accept-data-loss
             && bun prisma/seed.ts"

volumes:
  db-data:
